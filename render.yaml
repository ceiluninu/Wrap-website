databases:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  - name: wrapbrand-db
    plan: free
    databaseName: wrapbrand
    user: wrapbrand_user

services:
  # ─────────────────────────────────────────────
  # Spring Boot Backend (Web Service)
  # ─────────────────────────────────────────────
  - type: web
    name: wrapbrand-backend
    plan: free
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/wrapbrand-backend-1.0.0.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: wrapbrand-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: wrapbrand-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: wrapbrand-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: ALLOWED_ORIGINS
        value: https://wrapbrand-frontend.onrender.com

  # ─────────────────────────────────────────────
  # React Frontend (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: wrapbrand-frontend
    plan: free
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://wrapbrand-backend.onrender.com
